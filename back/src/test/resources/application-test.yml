# Profil Spring actif pendant les tests d'intégration (@ActiveProfiles("test")).
# Les propriétés spring.datasource.* ne sont volontairement PAS définies ici :
# elles sont injectées dynamiquement par AbstractIntegrationTest via
# @DynamicPropertySource, une fois le conteneur MySQL Testcontainers démarré.
oc:
  app:
    jwtExpirationMs: 86400000
    # Secret dédié aux tests uniquement, ne doit jamais être utilisé en dev/prod.
    jwtSecret: integration-test-only-secret-do-not-use-in-production

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  application:
    name: back-test

logging:
  level:
    org:
      hibernate:
        type: info
    com:
      openclassrooms: info
